# ============================================================
# MySQL StatefulSet (data-knowledge 域)
# 有状态数据库部署 - 持久化存储
# 对应 Docker Compose 中的 mysql 服务
# ============================================================
# 使用 StatefulSet 而非 Deployment 的原因：
#   1. 稳定的网络标识（pod-name-0, pod-name-1...）
#   2. 稳定的持久化存储（PVC 不随 Pod 删除而删除）
#   3. 有序的部署、扩展、滚动更新和删除
#   4. 适合数据库等有状态应用
# ============================================================

---
# ============================================================
# 1. MySQL Headless Service
# ============================================================
# Headless Service 用于 StatefulSet 的稳定网络标识
# 不分配 ClusterIP，直接通过 Pod IP 解析
apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: data-knowledge
  labels:
    domain: data-knowledge
    app: mysql
    app.kubernetes.io/part-of: agent-native-erp
  annotations:
    description: "MySQL Headless Service - 用于 StatefulSet 稳定标识"
spec:
  type: ClusterIP
  clusterIP: None    # Headless Service
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP

---
# ============================================================
# 2. MySQL ClusterIP Service
# ============================================================
# 常规 ClusterIP Service - 供 backend 服务访问
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: data-knowledge
  labels:
    domain: data-knowledge
    app: mysql
    app.kubernetes.io/part-of: agent-native-erp
    service: mysql
  annotations:
    description: "MySQL ClusterIP Service - 端口3306"
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP

---
# ============================================================
# 3. MySQL ServiceAccount
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql-sa
  namespace: data-knowledge
  labels:
    domain: data-knowledge
    app: mysql
    app.kubernetes.io/part-of: agent-native-erp

---
# ============================================================
# 4. MySQL StatefulSet
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: data-knowledge
  labels:
    domain: data-knowledge
    app: mysql
    version: v1
    app.kubernetes.io/part-of: agent-native-erp
  annotations:
    description: "MySQL 有状态部署 - 1副本, 10Gi持久化"
spec:
  serviceName: mysql-headless    # 关联 Headless Service
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        version: v1
        domain: data-knowledge
        app.kubernetes.io/part-of: agent-native-erp
      annotations:
        # Istio sidecar 注入
        sidecar.istio.io/inject: "true"
        # 数据库的 sidecar 资源配置
        sidecar.istio.io/proxyCPU: "50m"
        sidecar.istio.io/proxyMemory: "64Mi"
        sidecar.istio.io/proxyCPULimit: "200m"
        sidecar.istio.io/proxyMemoryLimit: "128Mi"
    spec:
      serviceAccountName: mysql-sa
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          # 环境变量从 Secret 引用
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DB
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: TZ
              value: "Asia/Shanghai"
          # 资源限制
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # 健康检查
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # 安全上下文
          securityContext:
            runAsNonRoot: true
            runAsUser: 999      # MySQL 镜像默认用户
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # 卷挂载
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          # 启动参数
          args:
            - --max_connections=100
            - --innodb_buffer_pool_size=128MB
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --slow_query_log=ON
            - --long_query_time=1    # 记录超过1秒的慢查询
      # 安全上下文
      securityContext:
        fsGroup: 999
      terminationGracePeriodSeconds: 60    # 数据库需要更多时间优雅关闭

  # ============================================================
  # 5. 持久化卷声明模板 (PVC)
  # ============================================================
  # 每个 Pod 自动创建独立的 PVC
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
        labels:
          app: mysql
          domain: data-knowledge
      spec:
        accessModes:
          - ReadWriteOnce    # 单节点读写（MySQL 不支持多节点写入）
        resources:
          requests:
            storage: 10Gi    # 10Gi 持久化存储
        # 存储类（如集群有多个 StorageClass，需指定）
        # storageClassName: fast-ssd
