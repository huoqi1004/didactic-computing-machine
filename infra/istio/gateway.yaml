# ============================================================
# Istio Gateway & VirtualService - 网关与虚拟服务
# 定义外部流量入口和路由规则
# 文档: https://istio.io/latest/docs/concepts/traffic-management/#gateways
# ============================================================
# Gateway: 定义网格边缘的负载均衡器配置（Ingress Gateway）
# VirtualService: 定义请求路由规则（URL匹配、超时、重试等）
# ============================================================

---
# ============================================================
# 1. Istio Ingress Gateway - HTTP 入口
# ============================================================
# 开发环境暂不配置 HTTPS 证书，仅使用 HTTP 80 端口
# 生产环境应添加 HTTPS 443 端口和 TLS 证书配置
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: erp-gateway
  namespace: user-interaction
  labels:
    domain: user-interaction
    app.kubernetes.io/part-of: agent-native-erp
  annotations:
    description: "ERP 系统 HTTP 入口网关 - 开发环境（暂无HTTPS）"
spec:
  # 使用 Istio 默认的 ingress gateway
  selector:
    istio: ingressgateway

  servers:
    # HTTP 80 端口 - 开发环境
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"    # 接受所有 host（开发环境）
      # 开发环境不强制 HTTPS 重定向
      # 生产环境应添加 HTTPS 重定向：
      # tls:
      #   httpsRedirect: true

    # ============================================================
    # 生产环境 HTTPS 配置（注释，供参考）
    # ============================================================
    # - port:
    #     number: 443
    #     name: https
    #     protocol: HTTPS
    #   hosts:
    #     - "erp.example.com"
    #   tls:
    #     mode: SIMPLE
    #     credentialName: erp-tls-cert    # Kubernetes TLS Secret
    #     minProtocolVersion: TLSV1_2
    #     maxProtocolVersion: TLSV1_3
    #     cipherSuites:
    #       - ECDHE-ECDSA-AES256-GCM-SHA384
    #       - ECDHE-RSA-AES256-GCM-SHA384
    #       - ECDHE-ECDSA-AES128-GCM-SHA256
    #       - ECDHE-RSA-AES128-GCM-SHA256

---
# ============================================================
# 2. VirtualService - Frontend 路由
# ============================================================
# 将根路径 / 路由到前端 Nginx 服务
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend-vs
  namespace: user-interaction
  labels:
    domain: user-interaction
    app.kubernetes.io/part-of: agent-native-erp
  annotations:
    description: "Frontend 虚拟服务 - 根路径路由到前端Nginx"
spec:
  # 绑定到 ERP 网关
  gateways:
    - erp-gateway
  # 匹配所有 host
  hosts:
    - "*"

  # HTTP 路由规则
  http:
    # 根路径 / -> frontend 服务
    # 匹配前端静态资源和 SPA 路由
    - name: frontend-root
      match:
        - uri:
            prefix: "/"    # 匹配所有路径（作为默认路由）
      # 排除 API 和 WebSocket 路径（由 backend-vs 处理）
      # 使用 priority 确保更具体的路由优先匹配
      route:
        - destination:
            host: frontend.user-interaction.svc.cluster.local
            port:
              number: 3000
      # 超时配置：前端静态资源响应快，5秒超时
      timeout: 5s
      # 重试配置：静态资源失败不重试（避免重复加载）
      retries:
        attempts: 1
        perTryTimeout: 5s
      # 响应头
      headers:
        response:
          set:
            X-Content-Type-Options: "nosniff"
            X-Frame-Options: "SAMEORIGIN"
            X-XSS-Protection: "1; mode=block"

---
# ============================================================
# 3. VirtualService - Backend API 路由
# ============================================================
# 将 /api/ 和 /ws 路径路由到后端 FastAPI 服务
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: backend-vs
  namespace: agent-execution
  labels:
    domain: agent-execution
    app.kubernetes.io/part-of: agent-native-erp
  annotations:
    description: "Backend 虚拟服务 - API和WebSocket路由到后端FastAPI"
spec:
  # 绑定到 ERP 网关（跨命名空间引用）
  gateways:
    - user-interaction/erp-gateway
  hosts:
    - "*"

  http:
    # ============================================================
    # 3.1 WebSocket 路由 - /ws 路径
    # ============================================================
    # WebSocket 长连接，超时时间设置为 3600 秒（1小时）
    # 用于 Agent 实时通信、事件流推送
    - name: backend-websocket
      match:
        - uri:
            prefix: "/ws"
      route:
        - destination:
            host: backend.agent-execution.svc.cluster.local
            port:
              number: 8000
      # WebSocket 超时配置：3600秒（1小时）
      # 长连接场景需要较长超时，防止空闲断开
      timeout: 3600s
      # WebSocket 不重试（长连接重试会导致连接重建）
      retries:
        attempts: 0
      # WebSocket 升级配置
      # Istio 自动处理 WebSocket 升级，无需额外配置
      headers:
        request:
          set:
            X-Forwarded-Proto: "https"

    # ============================================================
    # 3.2 API 路由 - /api/ 路径
    # ============================================================
    # REST API 请求，超时30秒，允许重试
    - name: backend-api
      match:
        - uri:
            prefix: "/api/"
      route:
        - destination:
            host: backend.agent-execution.svc.cluster.local
            port:
              number: 8000
      # API 超时配置：30秒
      # 匹配 LLM 请求超时（ERP_LLM_TIMEOUT=30）
      timeout: 30s
      # 重试配置：3次重试，每次30秒超时
      retries:
        attempts: 3
        perTryTimeout: 30s
        retryOn: "connect-failure,refused-stream,unavailable,cancelled,5xx"
      # 请求头透传
      headers:
        request:
          set:
            X-Forwarded-Proto: "https"
            X-Request-Source: "istio-gateway"

    # ============================================================
    # 3.3 健康检查路由 - /health 路径
    # ============================================================
    - name: backend-health
      match:
        - uri:
            exact: "/health"
      route:
        - destination:
            host: backend.agent-execution.svc.cluster.local
            port:
              number: 8000
      # 健康检查超时短，不重试
      timeout: 5s
      retries:
        attempts: 1

    # ============================================================
    # 3.4 API 文档路由 - /docs 路径（仅开发环境）
    # ============================================================
    - name: backend-docs
      match:
        - uri:
            prefix: "/docs"
      route:
        - destination:
            host: backend.agent-execution.svc.cluster.local
            port:
              number: 8000
      timeout: 10s
      retries:
        attempts: 1

    # ============================================================
    # 3.5 OpenAPI 规范路由 - /openapi.json
    # ============================================================
    - name: backend-openapi
      match:
        - uri:
            prefix: "/openapi.json"
      route:
        - destination:
            host: backend.agent-execution.svc.cluster.local
            port:
              number: 8000
      timeout: 10s
      retries:
        attempts: 1

    # ============================================================
    # 3.6 Prometheus 指标路由 - /metrics
    # ============================================================
    - name: backend-metrics
      match:
        - uri:
            prefix: "/metrics"
      route:
        - destination:
            host: backend.agent-execution.svc.cluster.local
            port:
              number: 8000
      timeout: 10s
      retries:
        attempts: 1
