# ============================================================
# Frontend Deployment & Service (user-interaction 域)
# Nginx 前端服务 - 静态资源托管与API代理
# 对应 Docker Compose 中的 frontend 服务
# ============================================================

---
# ============================================================
# 1. Frontend Service Account
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: user-interaction
  labels:
    domain: user-interaction
    app: frontend
    app.kubernetes.io/part-of: agent-native-erp
  annotations:
    description: "Frontend 服务账户 - Istio 工作负载身份"

---
# ============================================================
# 2. Frontend Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: user-interaction
  labels:
    domain: user-interaction
    app: frontend
    version: v1
    app.kubernetes.io/part-of: agent-native-erp
    service: frontend
  annotations:
    description: "Frontend ClusterIP Service - 端口3000"
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
      appProtocol: http

---
# ============================================================
# 3. Frontend Deployment
# ============================================================
# 2副本部署
# Istio sidecar 通过命名空间标签自动注入
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: user-interaction
  labels:
    domain: user-interaction
    app: frontend
    version: v1
    app.kubernetes.io/part-of: agent-native-erp
  annotations:
    description: "Frontend Nginx 部署 - 2副本"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v1
        domain: user-interaction
        app.kubernetes.io/part-of: agent-native-erp
      annotations:
        # Istio sidecar 注入
        sidecar.istio.io/inject: "true"
        # Sidecar 资源限制（前端流量较小，资源配置较低）
        sidecar.istio.io/proxyCPU: "50m"
        sidecar.istio.io/proxyMemory: "64Mi"
        sidecar.istio.io/proxyCPULimit: "200m"
        sidecar.istio.io/proxyMemoryLimit: "128Mi"
    spec:
      serviceAccountName: frontend-sa
      containers:
        # ============================================================
        # 3.1 Frontend Nginx 容器
        # ============================================================
        - name: frontend
          image: erp-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # 从 ConfigMap 挂载 nginx.conf
          envFrom:
            - configMapRef:
                name: backend-config
                optional: true    # 前端可能不需要后端配置，设为可选
          # 资源限制
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # 健康检查 - 存活探针
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # 健康检查 - 就绪探针
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          # 安全上下文
          securityContext:
            runAsNonRoot: true
            runAsUser: 101       # Nginx unprivileged 用户
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE   # Nginx 需要绑定端口（使用非特权端口3000则不需要）
          # 卷挂载
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      # 安全上下文
      securityContext:
        fsGroup: 101
      # 卷定义
      volumes:
        # Nginx 配置卷（从 ConfigMap 挂载）
        - name: nginx-config
          configMap:
            name: nginx-config
            items:
              - key: nginx.conf
                path: nginx.conf
        # Nginx 缓存卷
        - name: nginx-cache
          emptyDir:
            medium: Memory
        # Nginx PID 文件卷
        - name: nginx-run
          emptyDir:
            medium: Memory
      # 反亲和性
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - frontend
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 15
