# ============================================================
# Agent-Native ERP - 部署流水线
# 触发条件: push 到 main 分支且 CI 流水线全部通过
# 使用 workflow_run 在 ci.yml 完成后触发
# ============================================================
name: Deploy

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

# 部署任务权限
permissions:
  contents: read

jobs:
  # ============================================================
  # Job: 部署到 Staging 环境
  # 依赖 ci.yml 的所有 job 通过 (workflow_run conclusion == success)
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # 仅当 CI 流水线成功完成时才执行部署
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: staging
      url: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare environment file from GitHub Secrets
        # 从 GitHub Secrets 注入敏感配置，避免硬编码密钥泄露
        env:
          ERP_JWT_SECRET: ${{ secrets.ERP_JWT_SECRET }}
          ERP_LLM_API_KEY: ${{ secrets.ERP_LLM_API_KEY }}
          ERP_MYSQL_URL: ${{ secrets.ERP_MYSQL_URL }}
          ERP_REDIS_URL: ${{ secrets.ERP_REDIS_URL }}
          ERP_CORS_ORIGINS: ${{ secrets.ERP_CORS_ORIGINS }}
        run: |
            echo "Generating backend/.env from GitHub Secrets..."
            cat > backend/.env << ENVEOF
            # Auto-generated by GitHub Actions - do not commit
            ERP_APP_NAME=Agent-Native ERP
            ERP_APP_VERSION=1.0.0
            ERP_DEBUG=false
            ERP_ENVIRONMENT=production
            ERP_CURRENT_DOMAIN=agent_execution
            
            # Database (from Secrets)
            ERP_MYSQL_URL=${ERP_MYSQL_URL}
            ERP_DB_BACKEND=mysql
            
            # Redis (from Secrets)
            ERP_REDIS_URL=${ERP_REDIS_URL}
            
            # LLM (from Secrets)
            ERP_LLM_BASE_URL=https://api.deepseek.com
            ERP_LLM_MODEL=deepseek-v4-pro
            ERP_LLM_API_KEY=${ERP_LLM_API_KEY}
            ERP_LLM_ENABLED=true
            ERP_LLM_FALLBACK_TO_RULES=true
            ERP_LLM_TIMEOUT=60
            ERP_LLM_THINKING_ENABLED=false
            
            # JWT (from Secrets)
            ERP_JWT_SECRET=${ERP_JWT_SECRET}
            ERP_JWT_ALGORITHM=HS256
            ERP_JWT_EXPIRE_MINUTES=30
            
            # CORS (from Secrets)
            ERP_CORS_ORIGINS=${ERP_CORS_ORIGINS}
            
            # Audit
            ERP_AUDIT_CHAIN_ENABLED=true
            ERP_AUDIT_HASH_ALGORITHM=sha256
            
            # Agent
            ERP_AGENT_HEALTH_CHECK_INTERVAL=30
            ERP_AGENT_SLO_RESPONSE_TIME_MS=5000
            ERP_AGENT_CIRCUIT_BREAKER_THRESHOLD=5
            ENVEOF
            echo "Environment file generated with secrets."
            # Mask secrets in output
            echo "::add-mask::${ERP_JWT_SECRET}"
            echo "::add-mask::${ERP_LLM_API_KEY}"
            echo "::add-mask::${ERP_MYSQL_URL}"

      - name: Build all services
        run: docker compose build

      - name: Start all services
        run: docker compose up -d

      - name: Wait for backend to be ready
        # 等待后端健康检查通过, 最多等待 5 分钟
        run: |
          echo "Waiting for backend health check..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i/30: Backend not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "ERROR: Backend failed to become healthy within 300 seconds"
          echo "=== Container logs ==="
          docker compose logs --tail=50
          exit 1

      - name: Health check
        run: |
          echo "Performing health check..."
          RESPONSE=$(curl -sf http://localhost:8000/health)
          echo "Health response: $RESPONSE"
          echo "Health check passed!"

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Upload deployment logs on failure
        if: failure()
        run: docker compose logs > deploy-logs.txt 2>&1 || true

      - name: Upload deployment logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs
          path: deploy-logs.txt
          retention-days: 7
