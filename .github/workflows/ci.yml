# ============================================================
# Agent-Native ERP - CI 持续集成流水线
# 触发条件: push 到 main/develop 分支, PR 到 main 分支
# ============================================================
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# 同分支新提交取消旧构建, 节省 CI 资源
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI 所需权限
permissions:
  contents: read

jobs:
  # ============================================================
  # Job 1: 后端单元测试
  # ============================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 测试依赖 (pytest-asyncio 支持 asyncio_mode=auto)
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests
        working-directory: backend
        run: python -m pytest -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 14

  # ============================================================
  # Job 2: 后端代码检查 (ruff + black)
  # ============================================================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff check
        run: ruff check backend/

      - name: Run black --check
        run: black --check backend/

  # ============================================================
  # Job 3: 前端构建 (npm ci + tsc + vite build)
  # ============================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check TypeScript types
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 4: 安全扫描 (bandit + npm audit)
  # 任何安全基线不达标即阻断流水线
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Python 安全扫描 (bandit) ---
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run bandit (Python SAST)
        # -ll: 报告 MEDIUM 及以上严重级别的安全问题
        # 非零退出码即阻断 (安全基线: 无 medium/high 漏洞)
        run: bandit -r backend/ -ll -f json -o bandit-report.json

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 14

      # --- 前端依赖审计 (npm audit) ---
      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        # --audit-level=high: 仅 HIGH 及 CRITICAL 漏洞导致失败
        # 安全基线: 无 high/critical 依赖漏洞
        working-directory: frontend
        run: npm audit --audit-level=high

  # ============================================================
  # Job 5: E2E 端到端测试 (Playwright)
  # 依赖 frontend-build 和 backend-test 通过后执行
  # 启动后端 + 前端 dev server, 运行 Playwright 测试
  # ============================================================
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [ frontend-build, backend-test ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # --- 安装后端依赖 ---
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- 安装前端依赖 ---
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # --- 安装 Playwright 浏览器 ---
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # --- 启动后端服务 ---
      # 使用内存数据库 + 内存缓存, 无需 MySQL/Redis/Kafka 等外部依赖
      - name: Start backend service
        working-directory: backend
        env:
          ERP_DB_BACKEND: memory
          ERP_CACHE_BACKEND: memory
          ERP_KAFKA_ENABLED: 'false'
          ERP_LLM_ENABLED: 'false'
          ERP_JWT_SECRET: ci-e2e-test-secret-key
          ERP_ENVIRONMENT: development
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8005 > /tmp/backend.log 2>&1 &
          # 等待后端就绪（最多 60 秒）
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8005/docs | grep -q '^[1-4]'; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "=== Backend log ==="
          cat /tmp/backend.log
          echo "Backend failed to start"
          exit 1

      # --- 启动前端 dev server ---
      - name: Start frontend dev server
        working-directory: frontend
        run: |
          npm run dev > /tmp/frontend.log 2>&1 &
          # 等待前端就绪（最多 60 秒）
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:5173 | grep -q '^[1-4]'; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "=== Frontend log ==="
          cat /tmp/frontend.log
          echo "Frontend failed to start"
          exit 1

      # --- 运行 Playwright E2E 测试 ---
      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          CI: 'true'
        run: npx playwright test

      # --- 上传测试报告 ---
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report/
          retention-days: 14

      # --- 上传测试结果（截图/视频/trace） ---
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/e2e/test-results/
          retention-days: 14

      # --- 上传后端日志（用于调试） ---
      - name: Upload backend logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: /tmp/backend.log
          retention-days: 7

  # ============================================================
  # Job 6: Docker 镜像构建
  # 依赖 backend-test 和 frontend-build 通过后执行
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [ backend-test, frontend-build ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build -t erp-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t erp-frontend:ci ./frontend

      - name: List built images
        run: docker images --filter "reference=erp-*" --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
