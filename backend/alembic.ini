# ============================================================
# Alembic Database Migration Configuration
# ============================================================
# Uses pymysql (sync driver) for migrations; app runtime uses aiomysql (async)
# Commands:
#   alembic revision --autogenerate -m "description"  # Generate migration
#   alembic upgrade head                              # Apply migrations
#   alembic downgrade -1                              # Rollback one step
#   alembic history                                   # View migration history
# ============================================================

[alembic]
# Migration scripts directory
script_location = alembic

# Database URL (pymysql sync driver)
sqlalchemy.url = mysql+pymysql://erp:erp_password@localhost:3306/erp_db?charset=utf8mb4

# Timezone
timezone = Asia/Shanghai

# Migration script naming template
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Version table name
version_table = alembic_version

# ============================================================
# Logging
# ============================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
