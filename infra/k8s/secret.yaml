# ============================================================
# Kubernetes Secret - 敏感配置
# 存储 MySQL、Redis、JWT 等敏感凭证
# ============================================================
# 安全警告：
#   以下 Secret 仅用于开发环境示例
#   生产环境应使用 Vault、Sealed Secrets 或 External Secrets Operator
#   Base64 编码不是加密，请勿将生产密钥提交到版本控制
#
# 生成 Base64 编码的密钥：
#   echo -n "your-password" | base64
# ============================================================

---
# ============================================================
# 1. MySQL Secret (data-knowledge 域)
# ============================================================
# MySQL 数据库凭证
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: data-knowledge
  labels:
    domain: data-knowledge
    app: mysql
    app.kubernetes.io/part-of: agent-native-erp
  annotations:
    description: "MySQL 数据库凭证（开发环境示例）"
type: Opaque
data:
  # 数据库用户名（Base64编码: echo -n "erp_user" | base64）
  MYSQL_USER: ZXJwX3VzZXI=
  # 数据库密码（Base64编码: echo -n "erp_password" | base64）
  MYSQL_PASSWORD: ZXJwX3Bhc3N3b3Jk
  # 数据库名称（Base64编码: echo -n "erp_db" | base64）
  MYSQL_DB: ZXJwX2Ri
  # 超级用户密码（Base64编码: echo -n "mysql_admin" | base64）
  MYSQL_ROOT_PASSWORD: bXlzcWxfYWRtaW4=
  # 备份用户密码（Base64编码: echo -n "backup_user_pwd" | base64）
  MYSQL_BACKUP_PASSWORD: YmFja3VwX3VzZXJfcHdk

---
# ============================================================
# 2. Redis Secret (data-knowledge 域)
# ============================================================
# Redis 缓存凭证
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: data-knowledge
  labels:
    domain: data-knowledge
    app: redis
    app.kubernetes.io/part-of: agent-native-erp
  annotations:
    description: "Redis 缓存凭证（开发环境示例）"
type: Opaque
data:
  # Redis 密码（Base64编码: echo -n "redis_password" | base64）
  REDIS_PASSWORD: cmVkaXNfcGFzc3dvcmQ=
  # Redis ACL 文件内容（可选，用于更细粒度的访问控制）
  # REDIS_ACL: <base64-encoded-acl>

---
# ============================================================
# 3. JWT Secret (agent-execution 域)
# ============================================================
# JWT 签名密钥 - 用于 API 请求认证
# 生产环境应使用非对称密钥（RS256）并将私钥存储在 Vault 中
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: agent-execution
  labels:
    domain: agent-execution
    app: backend
    app.kubernetes.io/part-of: agent-native-erp
  annotations:
    description: "JWT 签名密钥（开发环境示例）"
type: Opaque
data:
  # JWT 密钥（Base64编码: echo -n "change-this-in-production-use-hsm" | base64）
  ERP_JWT_SECRET: Y2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi11c2UtaHNt
  # JWT 刷新令牌密钥
  ERP_JWT_REFRESH_SECRET: Y2hhbmdlLXRoaXMtcmVmcmVzaC1zZWNyZXQ=

---
# ============================================================
# 4. LLM API Secret (agent-execution 域)
# ============================================================
# LLM API 密钥 - 用于访问外部大模型 API
apiVersion: v1
kind: Secret
metadata:
  name: llm-api-secret
  namespace: agent-execution
  labels:
    domain: agent-execution
    app: backend
    app.kubernetes.io/part-of: agent-native-erp
  annotations:
    description: "LLM API 密钥（开发环境示例）"
type: Opaque
data:
  # LLM API Key（Base64编码: echo -n "sk-placeholder" | base64）
  ERP_LLM_API_KEY: c2stcGxhY2Vob2xkZXI=

---
# ============================================================
# 5. 生成生产环境密钥的说明
# ============================================================
# 以下命令可用于生成生产级密钥：
#
# # 生成随机 JWT 密钥（256位）
# openssl rand -base64 32
#
# # 生成随机 MySQL 密码
# openssl rand -base64 24
#
# # 生成随机 Redis 密码
# openssl rand -base64 24
#
# # 使用 kubectl 创建 Secret（不通过 YAML，避免 Base64 暴露）
# kubectl create secret generic jwt-secret \
#   --namespace=agent-execution \
#   --from-literal=ERP_JWT_SECRET="$(openssl rand -base64 32)"
#
# # 使用 Sealed Secrets（生产推荐）
# # 安装 Sealed Secrets Controller 后：
# echo -n "your-secret" | kubectl create secret generic jwt-secret \
#   --dry-run=client --from-file=ERP_JWT_SECRET=/dev/stdin -o yaml | \
#   kubeseal --controller-namespace=kube-system -o yaml > sealed-jwt-secret.yaml
