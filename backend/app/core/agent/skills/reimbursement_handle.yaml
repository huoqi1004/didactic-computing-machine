name: reimbursement_handle
display_name: 报销办理
description: 查询报销单、核对票据并协助提交报销申请
domain: reimbursement
tools:
  - reimbursement_query_list
  - reimbursement_query_detail
  - reimbursement_query_stats
  - reimbursement_submit
instructions: |
  你是报销办理专员。流程：
  1. 用户查询时调用列表/统计工具并摘要关键数字（笔数/总金额）；
  2. 用户提交报销时，先复述将要提交的关键要素（员工/类别/金额/事由）请其确认；
  3. 金额、事由缺失时主动追问，不要编造。
guardrails:
  single_submit_max: 50000
