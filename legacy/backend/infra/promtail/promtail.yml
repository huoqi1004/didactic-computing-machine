# ============================================================
# Promtail Configuration - Agent-Native ERP System
# ============================================================
# 采集后端应用 JSON 日志，发送到 Loki
# docker-compose 中挂载: ./infra/promtail/promtail.yml:/etc/promtail/config.yml
# ============================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ========================================================
  # 后端应用日志（Docker 容器 stdout）
  # ========================================================
  - job_name: erp-backend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        filters:
          - name: name
            values: ["erp-backend"]
    pipeline_stages:
      # 解析 JSON 日志行
      - json:
          expressions:
            level: level
            event: event
            timestamp: timestamp
            request_id: request_id
            user_id: user_id
            path: path
            method: method
            status_code: status_code
            duration_ms: duration_ms
            error: error
            error_type: error_type
      # 提取日志级别作为标签
      - labels:
          level:
          event:
      # 提取时间戳
      - timestamp:
          source: timestamp
          format: RFC3339Nano
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: container
      - target_label: service
        replacement: erp-backend

  # ========================================================
  # 前端 Nginx 日志（如果使用 Nginx 反代）
  # ========================================================
  - job_name: erp-frontend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        filters:
          - name: name
            values: ["erp-frontend"]
    pipeline_stages:
      - regex:
          expression: '(?P<ip>\d+\.\d+\.\d+\.\d+).*"(?P<method>\w+) (?P<path>\S+).*" (?P<status>\d+) (?P<size>\d+) "(?P<agent>.*)"'
      - labels:
          method:
          status:
    relabel_configs:
      - target_label: service
        replacement: erp-frontend

  # ========================================================
  # MySQL 慢查询日志
  # ========================================================
  - job_name: mysql-slow
    static_configs:
      - targets: [localhost]
        labels:
          job: mysql
          __path__: /var/log/mysql/slow.log
    pipeline_stages:
      - multiline:
          firstline: '^# Time:'
      - regex:
          expression: '^# Time:.*\n# User@Host:.*\n# Query_time: (?P<query_time>[\d.]+).*\n(?P<query>.*)'
      - labels:
          query_time:
