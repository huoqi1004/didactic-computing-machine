# ============================================================
# Agent-Native ERP - CI 持续集成流水线
# 触发条件: push 到 main/develop 分支, PR 到 main 分支
# ============================================================
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# 同分支新提交取消旧构建, 节省 CI 资源
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI 所需权限
permissions:
  contents: read

jobs:
  # ============================================================
  # Job 1: 后端单元测试
  # ============================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 测试依赖 (pytest-asyncio 支持 asyncio_mode=auto)
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests
        working-directory: backend
        run: python -m pytest -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 14

  # ============================================================
  # Job 2: 后端代码检查 (ruff + black)
  # ============================================================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff check
        run: ruff check backend/

      - name: Run black --check
        run: black --check backend/

  # ============================================================
  # Job 3: 前端构建 (npm ci + tsc + vite build)
  # ============================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check TypeScript types
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 4: 安全扫描 (bandit + npm audit)
  # 任何安全基线不达标即阻断流水线
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Python 安全扫描 (bandit) ---
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run bandit (Python SAST)
        # -ll: 报告 MEDIUM 及以上严重级别的安全问题
        # 非零退出码即阻断 (安全基线: 无 medium/high 漏洞)
        run: bandit -r backend/ -ll -f json -o bandit-report.json

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 14

      # --- 前端依赖审计 (npm audit) ---
      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        # --audit-level=high: 仅 HIGH 及 CRITICAL 漏洞导致失败
        # 安全基线: 无 high/critical 依赖漏洞
        working-directory: frontend
        run: npm audit --audit-level=high

  # ============================================================
  # Job 5: Docker 镜像构建
  # 依赖 backend-test 和 frontend-build 通过后执行
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [ backend-test, frontend-build ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build -t erp-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t erp-frontend:ci ./frontend

      - name: List built images
        run: docker images --filter "reference=erp-*" --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
