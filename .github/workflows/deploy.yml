# ============================================================
# Agent-Native ERP - 部署流水线
# 触发条件: push 到 main 分支且 CI 流水线全部通过
# 使用 workflow_run 在 ci.yml 完成后触发
# ============================================================
name: Deploy

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

# 部署任务权限
permissions:
  contents: read

jobs:
  # ============================================================
  # Job: 部署到 Staging 环境
  # 依赖 ci.yml 的所有 job 通过 (workflow_run conclusion == success)
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # 仅当 CI 流水线成功完成时才执行部署
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: staging
      url: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare environment file
        # 从 .env.example 创建 .env (生产环境应使用 GitHub Secrets 注入)
        run: |
          if [ ! -f backend/.env ]; then
            echo "backend/.env not found, creating from .env.example"
            cp backend/.env.example backend/.env
          fi
          echo "Environment file ready."

      - name: Build all services
        run: docker compose build

      - name: Start all services
        run: docker compose up -d

      - name: Wait for backend to be ready
        # 等待后端健康检查通过, 最多等待 5 分钟
        run: |
          echo "Waiting for backend health check..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i/30: Backend not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "ERROR: Backend failed to become healthy within 300 seconds"
          echo "=== Container logs ==="
          docker compose logs --tail=50
          exit 1

      - name: Health check
        run: |
          echo "Performing health check..."
          RESPONSE=$(curl -sf http://localhost:8000/health)
          echo "Health response: $RESPONSE"
          echo "Health check passed!"

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Upload deployment logs on failure
        if: failure()
        run: docker compose logs > deploy-logs.txt 2>&1 || true

      - name: Upload deployment logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs
          path: deploy-logs.txt
          retention-days: 7
